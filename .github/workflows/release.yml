name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Remove node_modules
        run: rm -rf node_modules

      - name: Create release zip
        run: |
          mkdir -p release
          zip -r release/52poke-evolution-${GITHUB_REF_NAME}.zip . \
            -x "./.git/*" \
            -x "./.github/*" \
            -x "./node_modules/*" \
            -x "./release/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/52poke-evolution-${{ github.ref_name }}.zip
